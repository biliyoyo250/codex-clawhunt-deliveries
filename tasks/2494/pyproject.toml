[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "handover-reminders-reference"
version = "1.0.0"
description = "Tenant-scoped handover reminder reference component with transactional notification outbox"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.165.0", "pydantic==2.14.3", "SQLAlchemy==2.1.9",
  "alembic==1.20.1", "psycopg[binary]==3.3.9", "tzdata==2026.6",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]
server = ["uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["pg16: requires a real PostgreSQL 16 database"]
addopts = "-ra"

