name: Task 2494 PostgreSQL 16 acceptance
run-name: Task 2494 acceptance ${{ inputs.run_tag }}

on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: Nonsecret correlation label for the acceptance run
        required: true
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tasks/2494
        shell: bash
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: handover_2494_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d handover_2494_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/handover_2494_test
      REQUIRE_POSTGRES: '1'
      HANDOVER_TEST_ALLOW_DESTRUCTIVE: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies and record environment
        run: |
          set -euo pipefail
          mkdir -p evidence
          python --version 2>&1 | tee evidence/environment.log
          python -m pip install -r requirements.txt 2>&1 | tee evidence/install.log
          python -m pip check 2>&1 | tee -a evidence/environment.log
          python -m pip freeze 2>&1 | tee -a evidence/environment.log
      - name: PostgreSQL 16 and migration roundtrip
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee evidence/postgres.log
          from sqlalchemy import text
          from handover_reminders.db import make_session_factory
          with make_session_factory().begin() as s:
              version = int(s.scalar(text('SHOW server_version_num')))
              print('server_version_num=', version)
              print('server_version=', s.scalar(text('SHOW server_version')))
              assert 160000 <= version < 170000
              s.execute(text('CREATE EXTENSION IF NOT EXISTS vector'))
              print('pgvector=', s.scalar(text("SELECT extversion FROM pg_extension WHERE extname='vector'")))
          PY
          python -m alembic upgrade head 2>&1 | tee evidence/migrations.log
          python -m alembic downgrade base 2>&1 | tee -a evidence/migrations.log
          python -m alembic upgrade head 2>&1 | tee -a evidence/migrations.log
          python -m alembic check 2>&1 | tee -a evidence/migrations.log
      - name: Producer and independent acceptance tests
        run: |
          set -euo pipefail
          python -m pytest tests --junitxml=evidence/junit.xml -vv 2>&1 | tee evidence/pytest.log
      - name: Preserve raw acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-2494-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: tasks/2494/evidence/
          if-no-files-found: error
